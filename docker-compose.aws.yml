services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: figurines
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d figurines"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/paul1919ucj/figurinehub-backend:latest
    environment:
      DB_HOST: database
      DB_NAME: figurines
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/paul1919ucj/figurinehub-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: